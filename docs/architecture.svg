<rect x="20" y="754" width="1560" height="230" rx="16" fill="none" stroke="#b8862b" stroke-width="1.2" stroke-opacity=".4"/>
<text x="40" y="869.0" font-size="18" font-weight="700" fill="#b8862b" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" transform="rotate(-90 40 869.0)">Decision: code pays</text>
<text x="60" y="869.0" font-size="13" font-weight="400" fill="#6b675f" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" transform="rotate(-90 60 869.0)">autosettle_engine (no AI)</text>
<rect x="80" y="782" width="290" height="180" rx="12" fill="#fbf3e1" stroke="#b8862b" stroke-width="1.6"/>
<text x="96" y="810" font-size="16" font-weight="700" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">Information gate</text>
<text x="96" y="834" font-size="15" font-weight="400" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">plate, parts, damage and</text>
<text x="96" y="855" font-size="15" font-weight="400" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">severity all known?</text>
<text x="96" y="876" font-size="15" font-weight="400" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">OFFER, ASK_MORE (at most 2),</text>
<text x="96" y="897" font-size="15" font-weight="400" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">ESCALATE or SURVEYOR</text>
<rect x="390" y="782" width="330" height="180" rx="12" fill="#fbf3e1" stroke="#b8862b" stroke-width="1.6"/>
<text x="406" y="810" font-size="16" font-weight="700" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">Price each line</text>
<text x="406" y="834" font-size="15" font-weight="400" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">rate card (151 rows), labour,</text>
<text x="406" y="855" font-size="15" font-weight="400" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">paint, depreciation, deductible;</text>
<text x="406" y="876" font-size="15" font-weight="400" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">lesser-of rule; offer and a</text>
<text x="406" y="897" font-size="15" font-weight="400" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">hidden upper bound</text>
<rect x="740" y="782" width="420" height="180" rx="12" fill="#fbf3e1" stroke="#b8862b" stroke-width="1.6"/>
<text x="756" y="810" font-size="16" font-weight="700" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">Dispute check</text>
<text x="756" y="834" font-size="15" font-weight="400" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">a quote line moves the offer only if the photos</text>
<text x="756" y="855" font-size="15" font-weight="400" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">show that part and the price is inside the genuine</text>
<text x="756" y="876" font-size="15" font-weight="400" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">range; at most 2 rounds; never past the upper bound;</text>
<text x="756" y="897" font-size="15" font-weight="400" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">free text can never change an amount</text>
<rect x="1180" y="782" width="380" height="180" rx="12" fill="#fbf3e1" stroke="#b8862b" stroke-width="1.6"/>
<text x="1196" y="810" font-size="16" font-weight="700" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">Hash-chained audit log</text>
<text x="1196" y="834" font-size="15" font-weight="400" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">every event carries the hash of the one</text>
<text x="1196" y="855" font-size="15" font-weight="400" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">before; any edit breaks the chain;</text>
<text x="1196" y="876" font-size="15" font-weight="400" fill="#1b1a17" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">verified in the API and the adjuster view</text>
