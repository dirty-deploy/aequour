<text x="648" y="249.0" font-size="13" font-weight="400" fill="#6b675f" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">photos, video, plate, quote, text</text>
<line x1="900" y1="286" x2="900" y2="204" stroke="#1b1a17" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="187" y1="392" x2="187" y2="464" stroke="#1b1a17" stroke-width="1.8" marker-end="url(#a)"/>
<text x="195" y="432.0" font-size="13" font-weight="400" fill="#6b675f" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">image files, clips</text>
<line x1="1420" y1="392" x2="1420" y2="464" stroke="#1b1a17" stroke-width="1.8" marker-end="url(#a)"/>
<text x="1428" y="432.0" font-size="13" font-weight="400" fill="#6b675f" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif">wording, quote reading</text>
<path d="M1240 576 L1240 740 L225 740 L225 782" fill="none" stroke="#1b1a17" stroke-width="1.8" marker-end="url(#a)"/>
